[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-intelligence-skill"
version = "1.0.0"
description = "Hindsight-powered Deal Intelligence Agent Skill with Adaptive MCP and Persistent Memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "python-pptx>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dias-setup = "src.setup_wizard:main"
dias-mcp = "mcp.server:main"
dias-skill = "src.core_skill:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
